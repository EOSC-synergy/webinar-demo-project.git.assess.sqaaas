      gitlab.a.incd.pt/jprm/webinar-demo-project get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.gimpy-violet-shrimp.sh
        container: qc.ver_stinky-cream-javanese
timeout: 5400
