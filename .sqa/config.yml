        - /usr/bin/env sh .sqa/script.crabby-thistle-cuttlefish.sh
        container: qc.sec_foggy-lime-uguisu
  QC.Sty:
    repos:
      gitlab.a.incd.pt/jprm/webinar-demo-project flake8:
        commands:
        - /usr/bin/env sh .sqa/script.surly-russet-rabbit.sh
        container: qc.sty_slimy-lime-worm
